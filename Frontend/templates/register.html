<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - JobPortal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            background: #1e3a8a;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 26px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Register Section */
        .register-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }

        /* Register Card */
        .register-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .register-card h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
            font-size: 14px;
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        /* Register Button */
        .register-btn {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        .register-btn:hover {
            background: #1e40af;
        }

        /* Login Link */
        .login-text {
            text-align: center;
            margin-top: 23px;
            color: #666;
            font-size: 14px;
        }

        .login-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background: #172554;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        /* Mobile */
        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin-left: 10px;
                margin-right: 10px;
            }

            .register-card {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>

        <div class="logo">
            JobPortal
        </div>

        <div>
            <a href="/">Home</a>
            <a href="/jobs">Jobs</a>
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        </div>

    </nav>


    <!-- Register Section -->
    <section class="register-section">

        <div class="register-card">

            <h1>Create Account</h1>

            <p class="subtitle">
                Join JobPortal and find your dream job.
            </p>


            <!-- Register Form -->
            <form method="POST" action="/register">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button type="submit" class="register-btn">
                    Create Account
                </button>

            </form>


            <p class="login-text">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        © 2026 JobPortal. All Rights Reserved.
    </footer>

</body>
</html>
```
